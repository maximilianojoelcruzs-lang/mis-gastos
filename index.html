<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mis Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  --bg:#000000; --surface:#111412; --ink:#EAF0EC; --muted:#94A39A;
  --line:#26302A; --green:#2C9C6E; --greensoft:#12271E;
  --gold:#D9A441; --goldsoft:#2A2212; --clay:#E0685C; --claysoft:#2E1815; --mint:#3DBE8A;
  font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased;
}
.mg-spin{animation:mgspin .8s linear infinite;}
@keyframes mgspin{to{transform:rotate(360deg);}}
.mg-splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:15px;}
.mg-splash .mg-spin{color:var(--green);}
.mg-authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.mg-authcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px 28px;width:100%;max-width:390px;box-shadow:0 8px 30px rgba(23,37,31,.08);text-align:center;}
.mg-logo{width:38px;height:38px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none;}
.mg-logo.big{width:56px;height:56px;border-radius:16px;margin:0 auto 16px;}
.mg-authcard h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;margin:0 0 4px;letter-spacing:-0.02em;}
.mg-authsub{font-size:13.5px;color:var(--muted);margin:0 0 22px;line-height:1.5;}
.mg-field{display:block;text-align:left;margin-bottom:14px;}
.mg-field span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.mg-field input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:15px;font-family:inherit;color:var(--ink);outline:none;background:#0B0D0C;transition:border-color .15s;}
.mg-field input:focus{border-color:var(--green);background:#0B0D0C;}
.mg-autherr{background:var(--claysoft);color:var(--clay);font-size:13px;font-weight:500;padding:10px 12px;border-radius:10px;margin-bottom:14px;text-align:left;}
.mg-authbtn{width:100%;border:none;background:var(--green);color:#fff;padding:13px;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s;}
.mg-authbtn:hover{filter:brightness(1.08);}
.mg-authbtn:disabled{opacity:.7;cursor:default;}
.mg-authnote{font-size:12px;color:var(--muted);margin:16px 0 0;}
.mg-root{min-height:100vh;padding:22px 16px 40px;max-width:640px;margin:0 auto;}
.mg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;}
.mg-brand{display:flex;align-items:center;gap:12px;min-width:0;}
.mg-header h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;line-height:1;margin:0;letter-spacing:-0.02em;}
.mg-header p{margin:3px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.mg-headright{display:flex;align-items:center;gap:8px;flex:none;}
.mg-save{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mint);opacity:0;transition:opacity .25s;font-weight:600;white-space:nowrap;}
.mg-save.on{opacity:1;}
.mg-save.muted{color:var(--muted);}
.mg-save.err{color:var(--clay);}
.mg-logoutbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;padding:8px;border-radius:10px;display:grid;place-items:center;}
.mg-logoutbtn:hover{border-color:var(--clay);color:var(--clay);background:var(--claysoft);}
.mg-nav{display:flex;flex-wrap:wrap;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:16px;}
.mg-nav button{flex:1 1 auto;border:none;background:transparent;color:var(--muted);padding:10px 8px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;white-space:nowrap;}
.mg-nav button.active{background:var(--green);color:#fff;}
.mg-nav button:not(.active):hover{background:var(--greensoft);color:var(--green);}
.mg-months{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;}
.mg-tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 15px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.mg-tab:hover{border-color:var(--green);color:var(--green);}
.mg-tab.active{background:var(--green);border-color:var(--green);color:#fff;}
.mg-tab.add{display:inline-flex;align-items:center;gap:4px;border-style:dashed;color:var(--green);}
.mg-tab.add:hover{background:var(--greensoft);}
.mg-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(23,37,31,.04);}
.mg-monthhead{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.mg-label{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;color:var(--ink);border:none;background:transparent;outline:none;flex:1;min-width:0;padding:2px 0;border-bottom:2px solid transparent;letter-spacing:-0.01em;}
.mg-label:focus{border-bottom-color:var(--greensoft);}
.mg-delmonth{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:4px;border-radius:8px;display:grid;place-items:center;}
.mg-delmonth:hover{background:var(--claysoft);color:var(--clay);}
.mg-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:6px 2px 16px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.mg-heroval{display:flex;flex-direction:column;gap:2px;}
.mg-herolabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.mg-heroval strong{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;line-height:1.05;letter-spacing:-0.02em;}
.mg-heroval strong.pos{color:var(--green);}
.mg-heroval strong.neg{color:var(--clay);}
.mg-herosub{font-size:12px;color:var(--muted);}
.mg-bar{flex:1;min-width:180px;}
.mg-bartrack{height:12px;border-radius:999px;background:var(--greensoft);overflow:hidden;}
.mg-barfill{height:100%;background:var(--green);border-radius:999px;transition:width .4s ease;}
.mg-barfill.over{background:var(--clay);}
.mg-barlegend{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--muted);}
.mg-barlegend .dot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:middle;}
.mg-barlegend .dot.spent{background:var(--green);}
.mg-barlegend .dot.save{background:var(--greensoft);border:1px solid var(--green);}
.mg-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.mg-stat{border-radius:13px;padding:11px 12px;display:flex;flex-direction:column;gap:5px;min-width:0;}
.mg-stat span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted);}
.mg-stat strong{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px;letter-spacing:-0.01em;overflow-wrap:anywhere;}
.mg-stat.income{background:var(--goldsoft);}
.mg-stat.income span{color:var(--gold);}
.mg-stat.spent{background:#1A1F1C;}
.mg-stat.save{background:var(--greensoft);}
.mg-stat.save strong{color:var(--green);}
.mg-stat.over{background:var(--claysoft);}
.mg-stat.over span,.mg-stat.over strong{color:var(--clay);}
.mg-statinput{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px;color:var(--gold);border:none;background:transparent;outline:none;width:100%;padding:0;border-bottom:2px solid transparent;letter-spacing:-0.01em;}
.mg-statinput:focus{border-bottom-color:var(--gold);}
.mg-listhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
.mg-listhead h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;margin:0;}
.mg-listhead span{font-size:12px;color:var(--muted);}
.mg-paybar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px;font-size:12px;}
.mg-paybar .paid{color:var(--green);font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.mg-paybar .pending{color:var(--muted);font-weight:600;}
.mg-paytrack{height:6px;border-radius:999px;background:var(--greensoft);overflow:hidden;margin:0 0 8px;}
.mg-payfill{height:100%;background:var(--green);border-radius:999px;transition:width .4s ease;}
.mg-list{display:flex;flex-direction:column;}
.mg-empty{text-align:center;color:var(--muted);font-size:13.5px;padding:22px 0;}
.mg-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.mg-row:last-child{border-bottom:none;}
.mg-row.paid .mg-name{text-decoration:line-through;color:var(--muted);}
.mg-name{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:14.5px;color:var(--ink);font-family:inherit;padding:5px 6px;border-radius:8px;font-weight:500;}
.mg-name:focus{background:#1A1F1C;}
.mg-name::placeholder{color:#AAB3A9;}
.mg-pct{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;width:34px;text-align:right;flex:none;}
.mg-amount{width:118px;flex:none;text-align:right;border:1px solid transparent;background:transparent;outline:none;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14.5px;color:var(--ink);padding:6px 9px;border-radius:9px;}
.mg-amount:hover{border-color:var(--line);}
.mg-amount:focus{border-color:var(--green);background:var(--greensoft);}
.mg-del{border:none;background:transparent;color:#B9C2B7;cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center;flex:none;}
.mg-del:hover{background:var(--claysoft);color:var(--clay);}
.mg-check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;flex:none;display:grid;place-items:center;color:#fff;transition:all .15s;padding:0;}
.mg-check:hover{border-color:var(--green);}
.mg-check.on{background:var(--green);border-color:var(--green);}
.mg-prow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);}
.mg-prow:last-child{border-bottom:none;}
.mg-prow.done .mg-pname{text-decoration:line-through;color:var(--muted);}
.mg-pname{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:14.5px;color:var(--ink);font-family:inherit;padding:5px 6px;border-radius:8px;font-weight:500;}
.mg-pname:focus{background:#1A1F1C;}
.mg-pname::placeholder{color:#AAB3A9;}
.mg-qty{width:44px;flex:none;text-align:center;border:1px solid transparent;background:transparent;outline:none;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;color:var(--muted);padding:6px 2px;border-radius:8px;}
.mg-qty:hover{border-color:var(--line);}
.mg-qty:focus{border-color:var(--green);background:var(--greensoft);color:var(--ink);}
.mg-wcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#0B0D0C;}
.mg-wtop{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.mg-wname{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:15px;font-weight:600;color:var(--ink);font-family:inherit;padding:4px 4px;border-radius:8px;}
.mg-wname:focus{background:#1A1F1C;}
.mg-wname::placeholder{color:#AAB3A9;}
.mg-wcard.done .mg-wname{text-decoration:line-through;color:var(--muted);}
.mg-wprice{width:104px;flex:none;text-align:right;border:1px solid var(--line);background:var(--surface);outline:none;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;color:var(--ink);padding:6px 8px;border-radius:9px;}
.mg-wprice:focus{border-color:var(--green);}
.mg-urlrow{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.mg-url{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);outline:none;font-size:12.5px;color:var(--ink);font-family:inherit;padding:7px 9px;border-radius:8px;}
.mg-url:focus{border-color:var(--green);}
.mg-url::placeholder{color:#AAB3A9;}
.mg-iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;padding:7px;border-radius:8px;display:grid;place-items:center;flex:none;}
.mg-iconbtn:hover{border-color:var(--green);color:var(--green);background:var(--greensoft);}
.mg-iconbtn.danger:hover{border-color:var(--clay);color:var(--clay);background:var(--claysoft);}
.mg-waddurl{border:none;background:transparent;color:var(--green);cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:4px;padding:4px 4px;border-radius:6px;margin-top:2px;}
.mg-waddurl:hover{background:var(--greensoft);}
.mg-wactions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.mg-shopbtn{border:1px solid var(--line);background:var(--surface);color:var(--green);cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:5px;padding:8px 11px;border-radius:9px;}
.mg-shopbtn:hover{background:var(--greensoft);border-color:var(--green);}
.mg-shopbtn:disabled{opacity:.45;cursor:default;}
.mg-shopbtn.ai{background:var(--green);color:#fff;border-color:var(--green);}
.mg-shopbtn.ai:hover{filter:brightness(1.08);background:var(--green);}
.mg-shopbtn.ai:disabled{opacity:.5;}
.mg-airesult{margin-top:9px;background:var(--greensoft);border-radius:10px;padding:10px 11px;font-size:13px;color:var(--ink);}
.mg-airesult .err{color:var(--clay);font-weight:500;}
.mg-airesult .line{font-family:'IBM Plex Mono',monospace;font-size:15px;}
.mg-airesult .line b{color:var(--green);}
.mg-airesult .nota{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4;}
.mg-airesult .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.mg-airesult .acts button{border:1px solid var(--line);background:var(--surface);color:var(--green);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:4px;padding:6px 9px;border-radius:8px;}
.mg-airesult .acts button:hover{background:var(--surface);border-color:var(--green);}
.mg-add{margin-top:12px;width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--green);padding:11px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;}
.mg-add:hover{border-color:var(--green);background:var(--greensoft);}
.mg-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;padding:0 4px;flex-wrap:wrap;}
.mg-footer span{font-size:11.5px;color:var(--muted);}
.mg-footer .right{display:flex;gap:6px;}
.mg-reset{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-family:inherit;display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:8px;font-weight:500;}
.mg-reset:hover{color:var(--clay);background:var(--claysoft);}
@media(max-width:480px){.mg-stats{grid-template-columns:1fr;}.mg-heroval strong{font-size:29px;}.mg-amount{width:96px;}.mg-nav button{font-size:12px;}}
</style>
</head>
